<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtlasPerformance | {% block title %}Dashboard{% endblock %}</title>

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ICONS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- TAILWIND CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#16181d', // Card Background
                            900: '#0e1015', // Main Background
                        },
                        atlas: {
                            cyan: '#06b6d4',  // Cyan-500 (Primary Brand)
                            green: '#10B981', // Emerald-500
                            gold: '#F59E0B',  // Amber-500
                            red: '#F43F5E',   // Rose-500
                            brand: '#06b6d4', // Replaced Indigo with Cyan
                        }
                    }
                }
            }
        }
    </script>

    <!-- PLOTLY -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-slate-800/80 backdrop-blur-md border border-slate-700/50;
            }
            .nav-item {
                @apply flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all duration-200 cursor-pointer mb-1;
            }
            .nav-item.active {
                @apply bg-gradient-to-r from-cyan-500/10 to-transparent text-cyan-400 border-l-4 border-cyan-400 rounded-r-xl rounded-l-none;
            }
            .nav-item.active i {
                @apply text-cyan-400;
            }
            .card-premium {
                @apply bg-slate-850 rounded-2xl border border-slate-800 shadow-xl shadow-black/20 hover:border-slate-700 transition-all duration-300;
            }
            .card-gradient-red {
                @apply bg-gradient-to-br from-rose-500 to-rose-600 text-white border-none;
            }
            .card-gradient-green {
                @apply bg-gradient-to-br from-emerald-500 to-emerald-600 text-white border-none;
            }
        }
        
        /* CustomScrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            @apply bg-slate-900;
        }
        ::-webkit-scrollbar-thumb {
            @apply bg-slate-700 rounded-full;
        }
        ::-webkit-scrollbar-thumb:hover {
            @apply bg-slate-600;
        }
    </style>
</head>

<body
    class="bg-slate-900 text-slate-50 font-sans antialiased overflow-hidden selection:bg-atlas-brand selection:text-white transition-colors duration-300">

    <div class="flex h-screen w-full">

        <!-- SIDEBAR -->
        <aside
            class="w-20 lg:w-64 h-full flex flex-col border-r border-slate-800 bg-slate-900 flex-shrink-0 transition-all duration-300">
            <!-- Brand -->
            <div class="h-20 flex items-center justify-center lg:justify-start lg:px-8">
                <a href="/" class="flex items-center hover:opacity-80 transition-opacity">
                    <div
                        class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                        <i class="fas fa-chart-simple text-white text-xs"></i>
                    </div>
                    <span class="ml-3 font-bold text-lg tracking-tight hidden lg:block text-white">
                        Atlas<span class="text-cyan-400">Perf</span>
                    </span>
                </a>
            </div>

            <!-- Nav -->
            <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-1">
                <a href="/dashboard" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                    <i class="fas fa-grip-vertical w-5 text-center"></i>
                    <span class="hidden lg:block font-medium">Dashboard</span>
                </a>
                <a href="/performance" class="nav-item {% if active_page == 'performance' %}active{% endif %}">
                    <i class="fas fa-chart-line w-5 text-center"></i>
                    <span class="hidden lg:block font-medium">Performance</span>
                </a>

                <div class="text-xs font-bold text-slate-500 uppercase tracking-wider px-4 mt-8 mb-4 hidden lg:block">
                    Données
                </div>

                <a href="/competitions" class="nav-item">
                    <i class="fas fa-trophy w-5 text-center"></i>
                    <span class="hidden lg:block font-medium">Compétitions</span>
                </a>
                <a href="/teams" class="nav-item">
                    <i class="fas fa-shield-halved w-5 text-center"></i>
                    <span class="hidden lg:block font-medium">Équipes</span>
                </a>
                <a href="/players" class="nav-item {% if active_page == 'players' %}active{% endif %}">
                    <i class="fas fa-users w-5 text-center"></i>
                    <span class="hidden lg:block font-medium">Joueurs</span>
                </a>
                <a href="/matches" class="nav-item {% if active_page == 'matches' %}active{% endif %}">
                    <i class="fas fa-futbol w-5 text-center"></i>
                    <span class="hidden lg:block font-medium">Matchs</span>
                </a>
            </nav>

            <!-- Footer Small -->
            <div class="p-6">
                <a href="/about"
                    class="block bg-slate-800/50 rounded-xl p-4 border border-slate-700/50 hover:bg-slate-800 hover:border-atlas-cyan/50 transition-all group cursor-pointer">
                    <div class="flex items-center space-x-3">
                        <div
                            class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-slate-400 group-hover:text-white group-hover:bg-atlas-cyan transition-colors">
                            <i class="fas fa-info text-xs"></i>
                        </div>
                        <div class="text-xs hidden lg:block">
                            <div class="font-bold text-white">À Propos</div>
                            <div class="text-slate-500 group-hover:text-atlas-cyan transition-colors">Version 1.0</div>
                        </div>
                    </div>
                </a>
            </div>
        </aside>

        <!-- MAIN CONTENT WRAPPER -->
        <div class="flex-1 flex flex-col h-full relative overflow-hidden">

            <!-- HEADER (Glassmorphism) -->
            <header class="h-16 w-full glass-panel z-10 flex items-center justify-between px-6 sticky top-0">
                <!-- Breadcrumbs / Title -->
                <!-- Breadcrumbs / Title -->
                <div class="flex items-center gap-3">
                    <!-- Styled Back Button -->
                    <button onclick="history.back()"
                        class="group flex items-center justify-center w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:border-atlas-cyan hover:bg-atlas-cyan/10 transition-all duration-300 shadow-lg shadow-black/20">
                        <i class="fas fa-arrow-left text-xs group-hover:-translate-x-0.5 transition-transform"></i>
                    </button>

                    <!-- Professional Breadcrumb -->
                    <div
                        class="hidden md:flex items-center bg-slate-800/40 rounded-xl border border-slate-700/30 p-1 backdrop-blur-sm">
                        <a href="/dashboard"
                            class="flex items-center px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-700/50 transition-all">
                            <div
                                class="w-5 h-5 rounded-md bg-gradient-to-br from-slate-700 to-slate-600 flex items-center justify-center mr-2 shadow-inner">
                                <i class="fas fa-th-large text-[10px] text-white"></i>
                            </div>
                            App
                        </a>

                        <i class="fas fa-chevron-right text-[10px] text-slate-600 mx-1"></i>

                        <div
                            class="px-3 py-1.5 rounded-lg bg-slate-900/80 text-xs font-bold text-white shadow-sm border border-slate-700/50 border-l-2 border-l-atlas-cyan flex items-center">
                            {% block header_title %}Overview{% endblock %}
                        </div>
                    </div>

                    <!-- Mobile Title (Visible only on small screens) -->
                    <div
                        class="md:hidden text-white font-bold text-sm bg-slate-800/80 px-3 py-1.5 rounded-lg border-l-2 border-atlas-cyan">
                        {{ self.header_title() }}
                    </div>
                </div>

                <!-- Right Actions -->
                <div class="flex items-center space-x-4">
                    <!-- Competition Selector Removed -->
                </div>
            </header>

            <!-- SCROLLABLE AREA -->
            <main class="flex-1 overflow-y-auto bg-slate-900 p-6 transition-colors duration-300">
                <!-- Content Inject -->
                {% block content %}{% endblock %}


            </main>

        </div>
    </div>

</body>

</html>
